<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quiz App</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <main
      class="container d-flex align-items-center justify-content-center vh-100"
    >
      <div
        id="start-screen"
        class="text-center p-5 shadow rounded bg-light"
        style="max-width: 400px; width: 100%"
      >
        <h1 class="mb-4 fw-bold text-primary">Quiz App</h1>

        <button id="start-btn" class="btn btn-primary btn-lg w-100">
          Start Quiz
        </button>
      </div>

      <div
        id="quiz-screen"
        class="p-4 p-md-5 shadow rounded bg-light d-none"
        style="max-width: 600px; width: 100%"
      >
        <div class="d-flex justify-content-between align-items-center mb-5">
          <h2 class="fs-5 mb-0">Quiz App</h2>

          <div>Time: <span id="timer">10</span></div>
        </div>

        <div class="mb-4">
          <h3 id="question" class="fs-4">Question will appear here</h3>
        </div>

        <div id="options-container" class="d-grid gap-3"></div>

        <div class="d-flex justify-content-between align-items-center mt-5">
          <span id="question-number">1 / 4</span>

          <button id="next-btn" class="btn btn-primary d-none">Next</button>
        </div>
      </div>

      <div
        id="result-screen"
        class="text-center p-5 shadow rounded bg-light d-none"
        style="max-width: 500px; width: 100%"
      >
        <h2 class="mb-4">Quiz Tamamlandı!</h2>

        <p id="result-text" class="fs-4"></p>

        <div class="d-flex gap-3">
          <button id="replay-btn" class="btn btn-primary w-50">Replay</button>

          <button id="quit-btn" class="btn btn-outline-danger w-50">
            Quit
          </button>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
